<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stylish Education Website</title>
    <link rel="stylesheet" href="college.css">
</head>
<body>
    <!-- Navigation Bar -->
    <nav class="nav">
        <div class="logo-container" id="logo">
            <span class="logo">EduTrack</span>
        </div>
        <div class="items-left">
            <a href="#attendance">Attendance</a>
            <a href="#marks">Marks</a>
            <a href="#gpa-cgpa">GPA/CGPA</a>
        </div>
    </nav>

    <!-- Links Section -->
    <section class="Links">
        <h1>Welcome to EduTrack</h1>
        <button class="link" id="man">Attendance Tracker</button>
        <button class="link" id="marks">Marks Calculator</button>
        <button class="link" onclick="showGPAOptions()">GPA / CGPA Calculator</button>
    </section>

    <!-- Attendance Section -->
    <section id="attendance">
        <h2>Attendance Tracker</h2>
        <input type="number" id="enter" placeholder="Total Hours" style="display:none;">
        <input type="number" id="enter_2" placeholder="Hours Attended" style="display:none;">
        <button id="submit" style="display:none;">Calculate Attendance</button>
        <table id="results" style="visibility:hidden;">
            <thead>
                <tr>
                    <th>Required %</th>
                    <th>Hours Needed</th>
                </tr>
            </thead>
            <tbody></tbody>
        </table>
    </section>

    <!-- Marks Section -->
    <section id="marks-section">
        <h2>Marks Calculator</h2>
        <button id="unit">Unit Test</button>
        <button id="mid">Mid Test</button>

        <input type="number" id="marks1" placeholder="Test 1 Marks" style="display:none;">
        <input type="number" id="marks2" placeholder="Test 2 Marks" style="display:none;">
        <input type="number" id="marks3" placeholder="Test 3 Marks" style="display:none;">
        <input type="number" id="att" placeholder="Attendance Marks" style="display:none;">
        <input type="number" id="ass" placeholder="Assignment Marks" style="display:none;">
        <button id="submit-2" style="display:none;">Calculate Marks</button>
        <p id="result"></p>
    </section>

    <!-- GPA / CGPA Section -->
    <section id="gpa-cgpa">
        <h2>GPA / CGPA Calculator</h2>
        <button onclick="showGPASection()">GPA Calculator</button>
        <button onclick="showCGPASection()">CGPA Calculator</button>

        <div id="gpaSection" style="display:none;">
            <h3>GPA Calculator</h3>
            <input type="number" id="numSubjectsGPA" placeholder="Number of Subjects">
            <button onclick="addSubjectRowsGPA()">Add Subjects</button>
            <table id="subjectTableGPA"></table>
            <button onclick="calculateGPA()">Calculate GPA</button>
            <p id="resultGPA">Your GPA out of 10: </p>
        </div>

        <div id="cgpaSection" style="display:none;">
            <h3>CGPA Calculator</h3>
            <input type="number" id="numSemesters" placeholder="Number of Semesters">
            <button onclick="addSemesterRows()">Add Semesters</button>
            <table id="semesterTable"></table>
            <button onclick="calculateCGPA()">Calculate CGPA</button>
            <p id="resultCGPA">Your CGPA out of 10: </p>
        </div>
    </section>

    <!-- Footer -->
    <footer>
        <div class="footer-container">
            <h3>EduTrack</h3>
            <p>Track your attendance, marks, GPA, and CGPA with ease.</p>
        </div>
    </footer>

    <script src="college.js"></script>
</body>
</html>
